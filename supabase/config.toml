# Decibel Supabase config. Link with: supabase link --project-ref fkjwglvztyyerewldnty
project_id = "decibels"

[api]
schemas = ["public"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/**"]

# Every function authenticates itself: app-facing ones verify the user's JWT with
# auth.getUser(), Telnyx webhooks verify their Ed25519 signature, Stripe verifies its
# signature header, cron functions check CRON_SECRET. Gateway JWT checks are off
# so webhooks can reach them and so the new asymmetric signing keys work.
[functions.billing]
verify_jwt = false
[functions.stripe-webhook]
verify_jwt = false
[functions.stripe-usage]
verify_jwt = false
[functions.import-csv]
verify_jwt = false
[functions.send-email]
verify_jwt = false
[functions.support]
verify_jwt = false
[functions.lifecycle-emails]
verify_jwt = false
[functions.unsubscribe]
verify_jwt = false
[functions.credit-alerts]
verify_jwt = false
[functions.demo-request]
verify_jwt = false
[functions.free-tools]
verify_jwt = false
[functions.ai-search]
verify_jwt = false
[functions.nightly]
verify_jwt = false
[functions.tps-check]
verify_jwt = false
[functions.telnyx-token]
verify_jwt = false
[functions.telnyx-call]
verify_jwt = false
[functions.telnyx-webhook]
verify_jwt = false
[functions.telnyx-numbers]
verify_jwt = false
[functions.telnyx-sync]
verify_jwt = false
